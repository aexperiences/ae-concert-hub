<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approval Desk · Amphitheater OS</title><link rel="icon" href="https://www.aexperiences.com/Amphitheater_OS.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="amph.css"></head><body>
<script src="amph.js"></script>
<script>
(function () {
  var E = window.Amph, c = E.mount({ active:"approvals.html", crumb:"Approval Desk" });
  c.appendChild(E.page("Approval Desk","Ghost Mode's gate. The org clears what it can honestly clear; only true fences reach this desk — opening an on-sale, cutting a settlement, spending, or sending an offer. Approving here does NOT sell, pay, sign or send anything. This is a showroom.",
    '<button class="btn ghost sm" onclick="location.reload()">Refresh</button>'));
  function render() {
    var host = document.getElementById("deskbox");
    var items = E.approvals().filter(function(a){return a.state==="Pending";});
    if (!items.length) { host.innerHTML = '<div class="empty">The desk is clear. The org has cleared everything it can honestly clear itself — the north star is an empty desk.</div>'; return; }
    host.innerHTML = items.map(function (a) {
      var badge = a.kind==="onsale"?"crim":(a.kind==="settle"?"gold":(a.kind==="pricing"?"watch":"ghost"));
      return '<div class="card" style="margin-bottom:12px"><div class="between"><div><h2>'+E.esc(a.title)+'</h2><div class="card-sub">'+E.esc(a.summary)+'</div></div><div>'+E.tag(a.kind,badge)+'</div></div>'+
        '<div class="fence'+(a.kind==="onsale"||a.kind==="settle"?" crim":"")+'"><b>Why it\'s here:</b> '+E.esc(a.why)+' <span class="muted small">— staged by '+E.esc(a.by)+'</span></div>'+
        '<div class="row" style="margin-top:11px"><button class="btn gold sm" data-ok="'+a.id+'">Approve (files it — sends nothing)</button><button class="btn ghost sm" data-hold="'+a.id+'">Hold</button></div></div>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("[data-ok]"), function (b){ b.addEventListener("click", function (){ E.decideApproval(b.dataset.ok,"Approved"); E.toast("Approved and filed — nothing was sold, paid, signed or sent.","ok"); render(); }); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-hold]"), function (b){ b.addEventListener("click", function (){ E.decideApproval(b.dataset.hold,"Held"); E.toast("Held. Left on the desk for you.","ok"); render(); }); });
  }
  c.appendChild(E.card('<div id="deskbox"></div>'));
  render();
})();
</script></body></html>
