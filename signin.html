<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in</title>
<link rel="icon" href="/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink,#1d1a16);background:var(--paper,#f4f1ea);min-height:100vh;display:grid;place-items:center;padding:20px}
  .card{background:var(--card,#fff);border:1px solid var(--line,#ddd6c8);border-radius:18px;max-width:400px;width:100%;padding:26px 24px;box-shadow:0 16px 44px rgba(60,45,20,.1)}
  .mk{width:46px;height:46px;border-radius:11px;background:var(--accent,#a8762c);color:var(--onAccent,#fff);display:grid;place-items:center;font-family:Georgia,serif;font-weight:800;font-size:22px}
  h1{font-family:Georgia,serif;margin:14px 0 3px;font-size:24px}
  .sub{color:var(--mut,#8b8175);font-size:13.5px;margin-bottom:18px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin:12px 0 5px}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
  .go{width:100%;margin-top:18px;border:none;border-radius:11px;padding:13px;cursor:pointer;font-weight:700;font-family:Georgia,serif;font-size:16px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--onAccent)}
  .err{color:#b23b3b;font-size:13px;margin-top:10px;min-height:16px}
  .credit{color:var(--mut);font-size:11.5px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="mk" id="mk">H</div>
  <h1 id="ttl">Sign in</h1>
  <div class="sub" id="sub"></div>
  <label>You are…</label>
  <select id="role"></select>
  <label>Your name</label>
  <input id="name" placeholder="e.g. Jordan Rivera" onkeydown="if(event.key==='Enter')go()">
  <div id="passWrap" style="display:none"><label>Administrator passcode</label><input id="pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')go()"></div>
  <button class="go" onclick="go()" id="goBtn">Enter →</button>
  <div class="err" id="err"></div>
  <div class="credit" id="credit"></div>
</div>
<script>
(function(){
  var C=window.HUB_CONFIG||{}, BR=C.brand||{}, R=C.roles||{}, P=C.rolePretty||{};
  document.getElementById('mk').textContent=(BR.short||'H')[0];
  document.getElementById('ttl').textContent='Sign in to '+(BR.name||'the OS');
  document.getElementById('sub').textContent=BR.tagline||'';
  document.getElementById('credit').innerHTML=BR.credit||'';
  document.title='Sign in · '+(BR.name||'OS');
  var roles=Object.keys(R);
  document.getElementById('role').innerHTML=roles.map(function(r){return '<option value="'+r+'">'+(P[r]||r)+'</option>';}).join('');
  document.getElementById('role').addEventListener('change',function(){document.getElementById('passWrap').style.display=this.value==='admin'?'block':'none';});
  window.go=function(){
    var role=document.getElementById('role').value, name=document.getElementById('name').value.trim();
    var pass=(document.getElementById('pass')||{}).value||'';
    var b=document.getElementById('goBtn'); b.textContent='…'; document.getElementById('err').textContent='';
    fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'signin',role:role,name:name,pass:pass})}).then(function(r){return r.json();}).then(function(j){
      b.textContent='Enter →';
      if(j&&j.ok){ try{localStorage.setItem('hub_sess',j.token);}catch(e){} location.href='/hub.html?sess='+encodeURIComponent(j.token); }
      else document.getElementById('err').textContent=(j&&j.message)||'Could not sign in.';
    }).catch(function(){b.textContent='Enter →';document.getElementById('err').textContent='Network hiccup — try again.';});
  };
})();
</script>
</body>
</html>
