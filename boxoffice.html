<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box Office · Amphitheater OS</title><link rel="icon" href="https://www.aexperiences.com/Amphitheater_OS.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="amph.css"></head><body>
<script src="amph.js"></script>
<script>
(function () {
  var E = window.Amph, c = E.mount({ active:"boxoffice.html", crumb:"Box Office" }), d = E.db();
  c.appendChild(E.page("Box Office & Ticketing","The count, tier by tier. GA, reserved and cabaret, holds and comps, sell-through and the walk-up estimate — the manifest that the settlement is cut from. On-sale shows only; a blocked show has no manifest because it can't sell.",
    '<span class="tag mag">live manifest</span>'));

  var onsale = d.shows.filter(function(s){return s.onSale;});
  c.appendChild(E.card('<h2>House at a glance</h2><div class="card-sub">Across every on-sale show.</div>'+
    '<div class="statrow">'+
      E.stat("Tickets sold", onsale.reduce(function(a,s){return a+E.soldTickets(s);},0).toLocaleString(), "paid, across on-sale shows", "mag")+
      E.stat("Gross box office", E.money(onsale.reduce(function(a,s){return a+E.grossBoxOffice(s);},0)), "at current counts", "good")+
      E.stat("Avg sell-through", E.pct(E.avgSellThrough(d)), "target "+E.BENCH.sellThrough.target[0]+"–"+E.BENCH.sellThrough.target[1]+"%", E.avgSellThrough(d)>=E.BENCH.sellThrough.target[0]?"good":"watch")+
      E.stat("Est. walk-up", E.BENCH.walkRate.median+"%", "of the final count buys at the door")+
    '</div>'+E.srcNote(E.BENCH.walkRate.src)));

  onsale.forEach(function(s){
    var rows = s.tiers.map(function(t){ var pct = t.cap? (t.sold/t.cap*100):0;
      return '<tr><td><div class="t-main">'+E.esc(t.name)+'</div><div class="t-sub">'+E.money(t.price)+' · '+t.comps+' comp · '+t.holds+' held</div></td>'+
      '<td class="mono">'+t.sold+' / '+t.cap+'</td>'+
      '<td class="fillcell"><span class="mono small">'+pct.toFixed(0)+'%</span><div class="bar '+(pct>=90?"good":"mag")+'"><i style="width:'+Math.min(100,pct)+'%"></i></div></td>'+
      '<td style="text-align:right" class="mono">'+E.money(t.sold*t.price)+'</td></tr>'; }).join("");
    c.appendChild(E.card('<div class="between"><div><h2>'+E.esc(s.artist)+'</h2><div class="card-sub">'+E.esc(s.date)+' · '+E.esc(s.genre)+' · cap '+E.capTickets(s)+'</div></div><div>'+E.tag(E.pct(E.sellThrough(s))+" sold", E.sellThrough(s)>=90?"good":"mag")+'</div></div>'+
      '<table><thead><tr><th>Tier</th><th>Sold / cap</th><th style="width:160px">Sell-through</th><th style="text-align:right">Gross</th></tr></thead><tbody>'+rows+
      '<tr class="totrow"><td><b>House</b></td><td class="mono"><b>'+E.soldTickets(s)+' / '+E.capTickets(s)+'</b></td><td class="mono"><b>'+E.pct(E.sellThrough(s))+'</b></td><td style="text-align:right" class="mono"><b>'+E.money(E.grossBoxOffice(s))+'</b></td></tr>'+
      '</tbody></table>'));
  });

  var blocked = E.blockedOnSale(d);
  if (blocked.length) c.appendChild(E.card('<div class="between"><div><h2>Not on sale yet</h2><div class="card-sub">These are announced but blocked at the rights-gate — no manifest because they can\'t sell a ticket until they\'re booked.</div></div><div>'+E.tag(blocked.length+" blocked","crim")+'</div></div>'+
    '<div class="stack">'+blocked.map(function(s){return '<div class="fence crim"><b>'+E.esc(s.artist)+'</b> — '+E.esc(s.date)+'. '+(s.contractSigned?"":"Contract unsigned. ")+(s.depositReceived?"":"Deposit not in. ")+'<a href="deals.html">Work the deal →</a></div>';}).join("")+'</div>'));
})();
</script></body></html>
